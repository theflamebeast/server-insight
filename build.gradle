plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Client gametests live in src/gametest and ship as their own tiny mod, so the fake
// server-side commands they need never end up in the released jar. `eula = true`
// accepts the Minecraft EULA for the throwaway dedicated server the test boots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'serverinsight-gametest'
		enableClientGameTests = true
		// There are no server-side gametests, and leaving this on makes `build` boot a
		// gametest server to run nothing. Flip it back on if src/gametest ever gains one.
		enableGameTests = false
		eula = true
	}
}

// runClientGameTest is not part of `build` (it needs a display and takes minutes), so
// without this a compile error in src/gametest would not surface until CI ran the
// separate gametest job. Compiling it here is nearly free.
tasks.named('build') {
	dependsOn 'gametestClasses'
}

// Values are read back through task inputs, not `project`: touching `project` while a
// task executes is deprecated and becomes an error in Gradle 10.
processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

jar {
	inputs.property 'archivesName', project.base.archivesName
	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
