name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      # Keeps the remapped mod jar downloadable from the run summary, so a build
      # can be tested in-game without a local Gradle setup. Loom also emits
      # -sources and -dev jars into the same dir; only the release jar is useful here.
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: serverinsight-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Separate job because it boots a real Minecraft client and a dedicated server,
  # which takes minutes and a software renderer — no reason to make the jar build
  # wait on it. This is the only check that can catch a mixin whose target Mojang renamed,
  # since that failure is invisible to the compiler.
  client-gametest:
    runs-on: ubuntu-latest
    # A normal run is a few minutes. When Minecraft cannot create ANY render backend
    # it hangs at startup instead of exiting — without this the job sits until
    # GitHub's 6-hour limit.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Since 26.3 the window comes from SDL3, and on this runner OpenGL fails at startup
      # ("Couldn't find matching GLX visual") with or without xvfb-run — the image
      # already provides a display. Minecraft then falls back to Vulkan, and with no
      # Vulkan driver installed every backend failed and the job hung. Mesa's lavapipe
      # is Vulkan in software (the log shows "Using graphics backend Vulkan ...
      # llvmpipe"). xvfb-run went with it: it no longer bought anything, and Fabric
      # API's own 26.3 client-gametest job runs without it.
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run client gametest
        run: ./gradlew runClientGameTest

      # Uploaded on failure too — when this job breaks, the screenshot of the chat
      # output is usually the fastest way to see what the mod actually printed.
      - name: Upload gametest screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
